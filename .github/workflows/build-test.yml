name: Build Accessory Alert Test

on:
  push:
    branches: ["test-accessory-alert"]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64
  THEOS_PACKAGE_SCHEME: rootless

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-rootless-v1

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install build dependencies
        run: brew install ldid xz dpkg

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"

          rm -rf .package-check
          dpkg-deb -x "$deb" .package-check

          dylib="$(find .package-check -type f -name 'AccessoryAlertTest.dylib' -print -quit)"
          test -n "$dylib"
          test "$(lipo -archs "$dylib")" = "arm64"

          test -f ".package-check/var/jb/Library/MobileSubstrate/DynamicLibraries/AccessoryAlertTest.plist"
          test -d ".package-check/var/jb/Library/PreferenceBundles/AccessoryAlertTestPrefs.bundle"
          test -f ".package-check/var/jb/Library/PreferenceLoader/Preferences/com.simon.flipofftestprefs.plist"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AccessoryAlertTest-arm64-rootless
          path: packages/*.deb
