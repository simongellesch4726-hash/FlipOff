name: Build Accessory Alert Test

on:
  push:
    branches: ["test-accessory-alert"]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:16.5:15.0
  ARCHS: arm64e
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache RootHide Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-roothide-theos-v1

      - name: Install RootHide Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Verify RootHide package scheme
        run: |
          set -euo pipefail
          test -d "$THEOS/vendor/mod/roothide"
          test -f "$THEOS/vendor/mod/roothide/package.mk"

      - name: Install patched iOS 16.5 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$tmpdir/sdks"
            git -C "$tmpdir/sdks" sparse-checkout set iPhoneOS16.5.sdk
            cp -R "$tmpdir/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Install build dependencies
        run: brew install ldid xz dpkg

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"

          echo "Package: $deb"
          echo "Architecture: $(dpkg-deb -f "$deb" Architecture)"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"

          rm -rf .package-check
          dpkg-deb -x "$deb" .package-check

          dylib="$(find .package-check -type f -name 'AccessoryAlertTest.dylib' -print -quit)"
          test -n "$dylib"
          echo "Dylib: $dylib"
          test "$(lipo -archs "$dylib")" = "arm64e"

          pref_bundle="$(find .package-check -type d -name 'AccessoryAlertTestPrefs.bundle' -print -quit)"
          test -n "$pref_bundle"
          test -f "$pref_bundle/Info.plist"

          pref_loader="$(find .package-check -type f -path '*/PreferenceLoader/Preferences/com.simon.flipofftestprefs.plist' -print -quit)"
          test -n "$pref_loader"

          springboard_filter="$(find .package-check -type f -name 'AccessoryAlertTest.plist' -print -quit)"
          test -n "$springboard_filter"

          echo "RootHide package contents:"
          find .package-check -maxdepth 5 -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AccessoryAlertTest-arm64e-roothide
          path: packages/*.deb
