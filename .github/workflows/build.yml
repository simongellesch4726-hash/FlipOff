name: Build FlipOff

on:
  push:
    branches: ["**"]
  pull_request:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-roothide-theos-v2
      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 --recursive https://github.com/roothide/theos.git "$THEOS"
      - name: Verify Theos packaging tool
        run: |
          set -euo pipefail
          chmod +x "$THEOS/vendor/dm.pl/dm.pl"
          test -x "$THEOS/bin/dm.pl"
          "$THEOS/bin/dm.pl" --help >/dev/null
      - name: Build FlipOff
        run: make package FINALPACKAGE=1
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          dpkg-deb -f "$deb" Package Version Architecture
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FlipOff-deb-arm64
          path: packages/*.deb
